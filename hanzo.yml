# Hanzo CI/CD — build. All real config is here; .hanzo/workflows/cicd.yml is
# triggers and an import of hanzoai/ci.

test:
  # Frozen, so the gate resolves the same tree the Dockerfile does. The lockfile
  # ships, and a stale one fails here rather than silently building something
  # else.
  - name: install
    run: |
      set -e
      corepack enable
      pnpm install --frozen-lockfile

  # Verbatim the build line the image runs, run before there is an image, so a
  # break arrives in a minute instead of after a full layer stack. `pnpm build`
  # is `tsc --noEmit` then `vite build`. A vite build that emits nothing still
  # exits 0, hence the file tests.
  - name: build
    run: |
      set -e
      pnpm build
      test -s dist/index.html
      test -d dist/assets

# hanzo.build is bytes, not a process: the export is the whole product and its
# API is api.hanzo.ai on another origin. It publishes to the Sites plane, where
# the edge serves the prefix straight from S3 — no image, no pod, no replicas.
# dist/404.html, written by vite.config.ts, is what boots the router on an
# address that has no file of its own.
site:
  slug: build
  dir: dist
  # The publish job is a fresh checkout: without a build line it has no dist.
  build: corepack enable && pnpm install --frozen-lockfile && pnpm build
  on: [main]
